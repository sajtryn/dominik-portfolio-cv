<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" fill="none" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <title>VW T5 – Draufsicht</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3442"/><stop offset=".5" stop-color="#161c25"/><stop offset="1" stop-color="#232c38"/>
    </linearGradient>
    <linearGradient id="bodySide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/><stop offset=".45" stop-color="#1e2632"/><stop offset="1" stop-color="#121821"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".42"/><stop offset=".55" stop-color="#0e7490" stop-opacity=".22"/><stop offset="1" stop-color="#164e63" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".0"/><stop offset=".45" stop-color="#fff" stop-opacity=".22"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8955d"/><stop offset=".5" stop-color="#a87443"/><stop offset="1" stop-color="#7c5230"/>
    </linearGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3bb85"/><stop offset=".5" stop-color="#d4a46b"/><stop offset="1" stop-color="#c08f58"/>
    </linearGradient>
    <linearGradient id="birch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecd9b0"/><stop offset="1" stop-color="#cfae78"/>
    </linearGradient>
    <linearGradient id="uph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52525b"/><stop offset=".6" stop-color="#3f3f46"/><stop offset="1" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="uphLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#71717a"/><stop offset="1" stop-color="#52525b"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4e4e7"/><stop offset=".5" stop-color="#a1a1aa"/><stop offset="1" stop-color="#71717a"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d4d8"/><stop offset="1" stop-color="#71717a"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27272a"/><stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
    <linearGradient id="solar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#0b1626"/>
    </linearGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="ledGlow">
      <stop offset="0" stop-color="#fef3c7" stop-opacity=".95"/><stop offset=".35" stop-color="#fbbf24" stop-opacity=".45"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadowR" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="40" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3 Q10 1.5 20 3 T40 3" stroke="#5c3a1e" stroke-opacity=".28" stroke-width=".8" fill="none"/>
    </pattern>
    <pattern id="quilt" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0 V18 M0 0 H18" stroke="#a1a1aa" stroke-opacity=".18" stroke-width=".8"/>
    </pattern>
    <pattern id="felt" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#26262b"/><circle cx="1.5" cy="1.5" r=".7" fill="#52525b"/><circle cx="4.5" cy="4.5" r=".7" fill="#3f3f46"/>
    </pattern>
    <pattern id="foam" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#1c1c20"/><circle cx="3" cy="3" r="1.4" fill="#27272a"/><circle cx="8" cy="7" r="1" fill="#2e2e33"/>
    </pattern>
    <pattern id="planks" width="400" height="12" patternUnits="userSpaceOnUse">
      <rect width="400" height="12" fill="#131418"/><path d="M0 11.5 H400" stroke="#1f2228" stroke-width="1"/>
    </pattern>
    <pattern id="mesh" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".6" fill="#22d3ee" fill-opacity=".6"/>
    </pattern>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- ground shadow -->
  <rect x="60" y="78" width="690" height="268" rx="40" fill="#000" opacity=".45" filter="url(#soft)"/>
  <!-- tyres -->
  <g fill="#0a0a0b" stroke="#3f3f46" stroke-width="1.5">
    <rect x="108" y="56" width="66" height="14" rx="4"/><rect x="108" y="330" width="66" height="14" rx="4"/>
    <rect x="590" y="56" width="66" height="14" rx="4"/><rect x="590" y="330" width="66" height="14" rx="4"/>
  </g>
  <g stroke="#27272a" stroke-width="1"><path d="M118 56v14M130 56v14M142 56v14M154 56v14M166 56v14M118 330v14M130 330v14M142 330v14M154 330v14M166 330v14M600 56v14M612 56v14M624 56v14M636 56v14M648 56v14M600 330v14M612 330v14M624 330v14M636 330v14M648 330v14"/></g>
  <!-- mirrors -->
  <path d="M598 66 l-4 -14 h22 l-4 14 z M598 334 l-4 14 h22 l-4 -14 z" fill="url(#bodySide)" stroke="#64748b" stroke-width="1"/>
  <!-- body shell -->
  <path d="M72 66 H640 Q702 66 730 92 Q748 112 748 200 Q748 288 730 308 Q702 334 640 334 H72 Q56 334 56 318 V82 Q56 66 72 66 Z" fill="url(#body)" stroke="#94a3b8" stroke-opacity=".7" stroke-width="2"/>
  <!-- bonnet crease + windscreen -->
  <path d="M660 96 Q700 200 660 304" stroke="#64748b" stroke-opacity=".6"/>
  <path d="M594 76 Q616 200 594 324 L640 318 Q660 200 640 82 Z" fill="url(#glass)" stroke="#64748b" stroke-width="1"/>
  <path d="M600 90 Q612 140 606 170" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
  <!-- cargo floor -->
  <rect x="72" y="80" width="380" height="240" fill="url(#planks)"/>
  <rect x="72" y="80" width="380" height="240" stroke="#94a3b8" stroke-opacity=".55" stroke-width="1.5"/>
  <!-- rear wheel arches inside the cargo area -->
  <path d="M106 80 h72 v10 q-36 8 -72 0 z M106 320 h72 v-10 q-36 -8 -72 0 z" fill="#1d2129" stroke="#64748b" stroke-opacity=".7"/>
  <!-- cab floor -->
  <path d="M452 80 H594 Q608 200 594 320 H452 Z" fill="#101216"/>
  <!-- rear barn doors + lights -->
  <path d="M58 84 V198 M58 202 V316" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <rect x="56" y="70" width="6" height="18" rx="2" fill="#b91c1c" opacity=".8"/><rect x="56" y="312" width="6" height="18" rx="2" fill="#b91c1c" opacity=".8"/>
  <!-- headlights -->
  <path d="M736 104 q6 14 6 26 l-8 -2 q-1 -12 -6 -22 z M736 296 q6 -14 6 -26 l-8 2 q-1 12 -6 22 z" fill="#e0f2fe" opacity=".7"/>
  <!-- sliding door opening + rail -->
  <path d="M300 334 H452" stroke="#22d3ee" stroke-opacity=".55" stroke-width="2"/>
  <path d="M300 320 H452" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 5"/>
  <!-- B-pillar -->
  <rect x="450" y="70" width="6" height="260" fill="#27303d" stroke="#94a3b8" stroke-opacity=".7"/>
  <!-- cab seats -->
  <g filter="url(#drop)">
    <rect x="470" y="92" width="70" height="72" rx="12" fill="url(#uph)" stroke="#71717a" stroke-width="1"/>
    <rect x="530" y="96" width="14" height="64" rx="5" fill="url(#uphLight)"/>
    <rect x="470" y="236" width="70" height="72" rx="12" fill="url(#uph)" stroke="#71717a" stroke-width="1"/>
    <rect x="530" y="240" width="14" height="64" rx="5" fill="url(#uphLight)"/>
  </g>
  <path d="M478 104 h44 M478 152 h44 M478 248 h44 M478 296 h44" stroke="#a1a1aa" stroke-opacity=".25" stroke-dasharray="2 3"/>
  <!-- steering wheel + dashboard -->
  <path d="M580 84 Q596 200 580 316 L594 318 Q608 200 594 82 Z" fill="#0b0c0f" stroke="#64748b" stroke-opacity=".6"/>
  <ellipse cx="570" cy="128" rx="7" ry="26" stroke="#a1a1aa" stroke-width="3"/>
  <!-- labels -->
  <text x="376" y="314" fill="#22d3ee" font-size="9" font-weight="500" text-anchor="middle" stroke="#09090b" stroke-width="3" stroke-linejoin="round" paint-order="stroke" >Schiebetür</text>
  <text x="516" y="204" fill="#a1a1aa" font-size="9" font-weight="500" text-anchor="middle" stroke="#09090b" stroke-width="3" stroke-linejoin="round" paint-order="stroke" letter-spacing="2.5">KABINE</text>
  <text x="748" y="36" fill="#a1a1aa" font-size="10" font-weight="600" text-anchor="end" stroke="#09090b" stroke-width="3" stroke-linejoin="round" paint-order="stroke" letter-spacing="2">VORNE →</text>
  <text x="56" y="376" fill="#a1a1aa" font-size="10" font-weight="600" text-anchor="start" stroke="#09090b" stroke-width="3" stroke-linejoin="round" paint-order="stroke" letter-spacing="2">← HINTEN</text>

</svg>
