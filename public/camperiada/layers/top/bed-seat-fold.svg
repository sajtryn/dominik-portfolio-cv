<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" fill="none" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <title>Łóżko składane z fotela (układ 4-osobowy)</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3442"/><stop offset=".5" stop-color="#161c25"/><stop offset="1" stop-color="#232c38"/>
    </linearGradient>
    <linearGradient id="bodySide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/><stop offset=".45" stop-color="#1e2632"/><stop offset="1" stop-color="#121821"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".42"/><stop offset=".55" stop-color="#0e7490" stop-opacity=".22"/><stop offset="1" stop-color="#164e63" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".0"/><stop offset=".45" stop-color="#fff" stop-opacity=".22"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8955d"/><stop offset=".5" stop-color="#a87443"/><stop offset="1" stop-color="#7c5230"/>
    </linearGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3bb85"/><stop offset=".5" stop-color="#d4a46b"/><stop offset="1" stop-color="#c08f58"/>
    </linearGradient>
    <linearGradient id="birch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecd9b0"/><stop offset="1" stop-color="#cfae78"/>
    </linearGradient>
    <linearGradient id="uph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52525b"/><stop offset=".6" stop-color="#3f3f46"/><stop offset="1" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="uphLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#71717a"/><stop offset="1" stop-color="#52525b"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4e4e7"/><stop offset=".5" stop-color="#a1a1aa"/><stop offset="1" stop-color="#71717a"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d4d8"/><stop offset="1" stop-color="#71717a"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27272a"/><stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
    <linearGradient id="solar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#0b1626"/>
    </linearGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="ledGlow">
      <stop offset="0" stop-color="#fef3c7" stop-opacity=".95"/><stop offset=".35" stop-color="#fbbf24" stop-opacity=".45"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadowR" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="40" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3 Q10 1.5 20 3 T40 3" stroke="#5c3a1e" stroke-opacity=".28" stroke-width=".8" fill="none"/>
    </pattern>
    <pattern id="quilt" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0 V18 M0 0 H18" stroke="#a1a1aa" stroke-opacity=".18" stroke-width=".8"/>
    </pattern>
    <pattern id="felt" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#26262b"/><circle cx="1.5" cy="1.5" r=".7" fill="#52525b"/><circle cx="4.5" cy="4.5" r=".7" fill="#3f3f46"/>
    </pattern>
    <pattern id="foam" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#1c1c20"/><circle cx="3" cy="3" r="1.4" fill="#27272a"/><circle cx="8" cy="7" r="1" fill="#2e2e33"/>
    </pattern>
    <pattern id="planks" width="400" height="12" patternUnits="userSpaceOnUse">
      <rect width="400" height="12" fill="#131418"/><path d="M0 11.5 H400" stroke="#1f2228" stroke-width="1"/>
    </pattern>
    <pattern id="mesh" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".6" fill="#22d3ee" fill-opacity=".6"/>
    </pattern>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- folding bed platform (deployed) -->
  <rect x="76" y="152" width="160" height="164" rx="6" fill="url(#oak)" fill-opacity=".2" stroke="#d4a46b" stroke-opacity=".8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <path d="M129 156 V312" stroke="#d4a46b" stroke-opacity=".55" stroke-dasharray="3 3"/><circle cx="129" cy="166" r="2.4" fill="#d4a46b"/><circle cx="129" cy="302" r="2.4" fill="#d4a46b"/><path d="M182 156 V312" stroke="#d4a46b" stroke-opacity=".55" stroke-dasharray="3 3"/><circle cx="182" cy="166" r="2.4" fill="#d4a46b"/><circle cx="182" cy="302" r="2.4" fill="#d4a46b"/>
  <!-- cushions laid flat -->
  <rect x="82" y="158" width="44" height="152" rx="6" fill="url(#uphLight)" fill-opacity=".35"/>
  <rect x="133" y="158" width="46" height="152" rx="6" fill="url(#uphLight)" fill-opacity=".35"/>
  <rect x="186" y="158" width="46" height="152" rx="6" fill="url(#uphLight)" fill-opacity=".35"/>
  <!-- support legs -->
  <rect x="80" y="156" width="6" height="6" rx="1" fill="url(#metal)"/><rect x="80" y="308" width="6" height="6" rx="1" fill="url(#metal)"/><rect x="228" y="156" width="6" height="6" rx="1" fill="url(#metal)"/><rect x="228" y="308" width="6" height="6" rx="1" fill="url(#metal)"/>
  <!-- two individual seats (travel position) -->
  <g filter="url(#drop)">
    <rect x="236" y="152" width="42" height="78" rx="9" fill="url(#uph)" stroke="#71717a"/>
    <rect x="274" y="154" width="13" height="74" rx="5" fill="url(#uphLight)" stroke="#71717a"/>
    <rect x="286" y="176" width="8" height="30" rx="3" fill="url(#uphLight)"/>
    <path d="M242 160 L270 222" stroke="#18181b" stroke-opacity=".7" stroke-width="2.5"/>
    <rect x="236" y="238" width="42" height="78" rx="9" fill="url(#uph)" stroke="#71717a"/>
    <rect x="274" y="240" width="13" height="74" rx="5" fill="url(#uphLight)" stroke="#71717a"/>
    <rect x="286" y="262" width="8" height="30" rx="3" fill="url(#uphLight)"/>
    <path d="M242 246 L270 308" stroke="#18181b" stroke-opacity=".7" stroke-width="2.5"/></g>
  <!-- 4-person layout -->
  <g><circle cx="462" cy="104" r="8" fill="#34d399" stroke="#09090b" stroke-width="2"/><text x="462" y="107.5" fill="#09090b" font-size="10" font-weight="700" text-anchor="middle">1</text></g><g><circle cx="462" cy="248" r="8" fill="#34d399" stroke="#09090b" stroke-width="2"/><text x="462" y="251.5" fill="#09090b" font-size="10" font-weight="700" text-anchor="middle">2</text></g><g><circle cx="258" cy="191" r="8" fill="#34d399" stroke="#09090b" stroke-width="2"/><text x="258" y="194.5" fill="#09090b" font-size="10" font-weight="700" text-anchor="middle">3</text></g><g><circle cx="258" cy="277" r="8" fill="#34d399" stroke="#09090b" stroke-width="2"/><text x="258" y="280.5" fill="#09090b" font-size="10" font-weight="700" text-anchor="middle">4</text></g>
  <text x="156" y="226" fill="#e4e4e7" font-size="11" font-weight="600" text-anchor="middle" stroke="#09090b" stroke-width="3" stroke-linejoin="round" paint-order="stroke" >Łóżko z fotela</text>
  <text x="156" y="242" fill="#a1a1aa" font-size="9" font-weight="500" text-anchor="middle" stroke="#09090b" stroke-width="3" stroke-linejoin="round" paint-order="stroke" >rozłożone 175 × 116 cm</text>
  <text x="156" y="256" fill="#34d399" font-size="9" font-weight="500" text-anchor="middle" stroke="#09090b" stroke-width="3" stroke-linejoin="round" paint-order="stroke" >układ 4-osobowy</text>

</svg>
